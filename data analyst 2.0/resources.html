<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaggle & Learning Resources | Aptech@Mahanagar, Lko</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBlue: '#0693E3',
            brandBlueDark: '#032656',
            brandPurple: '#7D077D',
            lightBg: '#F8FAFC',
            cardBg: '#FFFFFF',
            textMain: '#2B161B',
            textMuted: '#453E3E',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-lightBg text-textMain min-h-screen flex flex-col font-sans pb-24">

  <!-- NAVIGATION HEADER -->
  <header class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur-md border-b border-gray-200/80 z-50 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-brandBlue to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-brandBlue/20 group-hover:scale-105 transition-transform">
          A
        </div>
        <span class="font-bold text-xl tracking-tight text-brandBlueDark">
          Aptech<span class="text-brandBlue">@Mahanagar, Lko</span>
        </span>
      </a>

      <!-- Menu links -->
      <nav class="hidden md:flex items-center gap-8 font-medium text-sm text-textMuted">
        <a href="index.html" class="nav-link-btn hover:text-brandBlue transition-colors">Home</a>
        <a href="dashboard.html" class="nav-link-btn hover:text-brandBlue transition-colors">Dashboard</a>
        <a href="practice.html" class="nav-link-btn hover:text-brandBlue transition-colors">Practice Portal</a>
        <a href="challenges.html" class="nav-link-btn hover:text-brandBlue transition-colors">Challenges</a>
        <a href="interview.html" class="nav-link-btn hover:text-brandBlue transition-colors">Test Paper & Prep</a>
        <a href="analytics.html" class="nav-link-btn hover:text-brandBlue transition-colors">Analytics</a>
        <a href="resources.html" class="nav-link-btn text-brandBlue border-b-2 border-brandBlue">Free Resources</a>
      </nav>

      <!-- Right Header Actions -->
      <div class="flex items-center gap-4">
        <a href="dashboard.html" class="hidden sm:inline-flex items-center justify-center px-5 py-2.5 text-xs font-bold text-white bg-brandBlue hover:bg-brandBlue/90 rounded-full transition-all shadow-md shadow-brandBlue/10 hover:shadow-lg">
          Dashboard
        </a>
        <a href="profile.html" class="flex items-center gap-2 cursor-pointer">
          <img src="https://ui-avatars.com/api/?name=Student&background=0693E3&color=ffffff&bold=true" class="w-8 h-8 rounded-full border border-gray-200" alt="Avatar">
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="flex-grow pt-20 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 space-y-12">
    
    <div class="text-center max-w-3xl mx-auto space-y-2 border-b pb-6">
      <span class="text-xs text-brandBlue font-bold uppercase tracking-wider block">KAGGLE & PREPARATION RESOURCES</span>
      <h2 class="text-3xl font-black text-brandBlueDark">Curated Kaggle & Data Science Resources</h2>
      <p class="text-gray-500 text-sm">Access top study materials, Kaggle open datasets, Python/SQL micro-courses, and Machine Learning banks.</p>
    </div>

    <!-- JSON driven grid container -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="resources-grid">
      <!-- Populated dynamically from data.js resourcesCatalog -->
    </div>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderResourcesCatalog();
    });

    function renderResourcesCatalog() {
      const container = document.getElementById('resources-grid');
      if (!container) return;

      container.innerHTML = '';
      resourcesCatalog.forEach(res => {
        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between hover:border-brandBlue/35 hover:shadow-md transition-all spring-hover";
        card.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-md bg-blue-50 border border-brandBlue/25 text-xs font-semibold text-brandBlue">${res.category}</span>
              <span class="text-lg">${res.icon}</span>
            </div>
            <h3 class="font-bold text-lg text-brandBlueDark">${res.title}</h3>
            <p class="text-xs text-gray-500 leading-relaxed">${res.description}</p>
          </div>
          <div class="mt-6 pt-4 border-t flex items-center justify-between">
            <span class="text-[10px] font-bold text-gray-400 uppercase font-mono">${res.tag || 'Free'}</span>
            <a href="${res.url}" target="_blank" class="px-4 py-2 bg-brandBlue hover:bg-brandBlue/90 text-white rounded-xl text-xs font-bold shadow-sm transition-all">
              Open Resource →
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
